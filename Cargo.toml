[package]
name = "xdts"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Read and write XDTS, TDTS, STS and DiTiS animation exposure sheets, and read them out of OpenToonz scenes, with no dependencies"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/SehataKuro/xdts"
keywords = ["animation", "timesheet", "xdts", "tdts", "exposure-sheet"]
categories = ["parser-implementations", "multimedia"]
# What is here for the repository and not for anyone using the crate. The
# tests and their fixtures do ship, so that `cargo test` works from the
# package, and NOTICE says where each fixture came from.
exclude = [".github/", ".gitattributes", ".gitignore"]

# Both formats are plain JSON behind a header line, and the JSON writer and
# parser are in-tree, so this crate has no dependencies at all and no feature
# flags to decide between.

[dependencies]

# Used only by tests/json_oracle.rs, which checks the in-tree parser and
# writer against it on thousands of documents. A test dependency is never
# built for anything that depends on this crate, so the line above still
# holds for every user of it.
[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
